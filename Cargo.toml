# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-library-file"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-library-file"
description = "File system acts every layer shares, one copy of each: a directory synced to its device, so a name made, renamed or removed in it outlives a crash (fsync of the directory on Unix; FlushFileBuffers on a handle opened with FILE_FLAG_BACKUP_SEMANTICS on Windows)."
publish = false

[lib]
path = "src/lib.rs"

[features]
# A test's own temporary folder (`temporary.rs`), for the tests of every
# crate that takes this one with it from its dev-dependencies: never in a
# node.
test-support = ["dep:uuid"]

[dependencies]
# The random part of a test folder's name, a UUIDv7 (`temporary.rs`), as
# xmip-core names its identifiers: under `test-support` alone.
uuid = { version = "1", features = ["v7"], optional = true }

[dev-dependencies]
# This crate's own tests make their folder with `temporary.rs` too.
uuid = { version = "1", features = ["v7"] }

[lints.rust]
# forbid, not deny: a library opening files through the standard library has
# no business writing unsafe.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
