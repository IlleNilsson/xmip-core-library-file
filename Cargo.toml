[package]
name = "xmip-core-library-file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-library-file"
description = "File system acts every layer shares, one copy of each: a directory synced to its device, so a name made, renamed or removed in it outlives a crash; and a file held by its writer while it is open (flock on Unix, sharing that refuses its removal on Windows), so a removal takes only a file no live process writes."
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# A test's own temporary folder (`temporary.rs`), for the tests of every
# crate that takes this one with it from its dev-dependencies: never in a
# node.
test-support = ["dep:uuid"]

[dependencies]
# The random part of a test folder's name, a UUIDv7 (`temporary.rs`), as
# xmip-core names its identifiers: under `test-support` alone.
uuid = { version = "1", features = ["v7"], optional = true }

[dev-dependencies]
# This crate's own tests make their folder with `temporary.rs` too.
uuid = { version = "1", features = ["v7"] }

[lints]
workspace = true
